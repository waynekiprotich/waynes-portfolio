    <script>
      // Resolve the theme before first paint, so there is never a flash of
      // the wrong palette. An explicit choice (from the toggle) is read from
      // localStorage and wins; otherwise the system preference is used.
      // Failure here (private browsing, storage disabled) just falls through
      // to the CSS `prefers-color-scheme` branch in styles/index.css — theme
      // resolution never depends on this script succeeding.
      (function () {
        try {
          var stored = localStorage.getItem('wk:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#171613' : '#EFECE5');
        } catch (e) {
          /* CSS fallback still resolves the correct theme. */
        }
      })();
    </script>
